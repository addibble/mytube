name: MyTube
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit.git
    from: 0.4.9
targets:
  MyTube:
    type: application
    platform: iOS
    sources:
      - MyTube
    dependencies:
      - package: YouTubeKit
    info:
      path: MyTube/Info.plist
      properties:
        CFBundleDisplayName: MyTube
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSSiriUsageDescription: Lets you ask Siri to play or search for audiobooks in MyTube.
        INIntentsSupported:
          - INPlayMediaIntent
          - INSearchForMediaIntent
        INSupportedMediaCategories:
          - INMediaCategoryAudiobooks
          - INMediaCategoryGeneral
        # Siri tends to hear "MyTube" as "YouTube"; the spaced spelling gives it a second thing to match.
        INAlternativeAppNames:
          - INAlternativeAppName: My Tube
            INAlternativeAppNamePronunciationHint: my tube
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    entitlements:
      path: MyTube/MyTube.entitlements
      properties:
        com.apple.developer.carplay-audio: true
        com.apple.developer.siri: true
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drewdibble.mytube
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
